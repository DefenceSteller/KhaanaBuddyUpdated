# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx1024M -Xss512k -Xss512k

# Disable parallel builds
org.gradle.parallel=false

# Enable daemon for stability
org.gradle.daemon=true

# Prevent build cache issues
android.useAndroidX=true
android.enableJetifier=true

# Increase timeout
org.gradle.workers.max=2
# Compile Kotlin inside the Gradle daemon (no separate Kotlin daemon JVM - saves ~1.5GB RAM)
kotlin.compiler.execution.strategy=in-process
# Disable native file watcher (caused std::bad_alloc crashes from memory pressure)
org.gradle.vfs.watch=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false