name: khaanabuddy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  google_generative_ai: ^0.4.7

  # ✅ Latest stable & compatible Firebase versions (as of Oct 2025)
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3

  # ✅ Google Sign-In (latest compatible)
  google_sign_in: ^5.4.4

  shared_preferences: ^2.3.3
  youtube_player_flutter: ^9.0.4
  flutter_tts: ^4.2.3
  speech_to_text: ^7.0.0
  animated_splash_screen: ^1.3.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2

# ✅ Add this section to fix flutter_inappwebview namespace issue

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4   # ✅ keep only ONE version here

flutter:
  uses-material-design: true
  assets:
    - "lib/assets/CookMate_logo.png"
    - "lib/assets/google_logo.png"

# ✅ Step 3: Add launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/khaanabuddy_logo_full.png"
